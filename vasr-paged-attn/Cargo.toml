[package]
name = "vasr-paged-attn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PagedAttention KV cache and batch runtime for VASR"

[dependencies]
anyhow = "1"
candle-core = { workspace = true }
candle-metal-kernels = { workspace = true, optional = true }
dispatch2 = { version = "0.3.0", optional = true }
float8 = "0.7"
half = "2"
objc2-metal = { version = "0.3.2", optional = true }
objc2 = { version = "0.6.3", optional = true }
thiserror = { version = "2", optional = true }
tracing = "0.1"
vasr-quant = { path = "../vasr-quant", default-features = false }

[dev-dependencies]
candle-nn = { workspace = true }

[build-dependencies]
cudaforge = { version = "0.1.3", optional = true }

[features]
default = []
paged-attn = []
metal = ["candle-core/metal"]
cuda = ["candle-core/cuda", "dep:cudaforge"]
cuda-graph = ["cuda", "vasr-quant/cuda"]
cuda-paged-attn = ["cuda", "paged-attn", "vasr-quant/cuda-paged-attn"]
metal-paged-attn = [
  "metal",
  "paged-attn",
  "vasr-quant/metal-paged-attn",
  "dep:candle-metal-kernels",
  "dep:dispatch2",
  "dep:objc2-metal",
  "dep:objc2",
  "dep:thiserror",
]

[lints]
workspace = true
