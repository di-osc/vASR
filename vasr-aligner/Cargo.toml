[package]
name = "vasr-aligner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Forced alignment models and text processing for vASR"
categories = ["science"]
keywords = ["asr", "alignment", "timestamps", "speech"]

[dependencies]
anyhow = "1"
candle-core = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
lindera = { version = "2.2.0", features = ["embed-ipadic"] }
lindera-ipadic = { version = "2.2.0", features = ["embed-ipadic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1"
asr-data = { workspace = true }
vasr = { path = "../vasr" }

[lints]
workspace = true
