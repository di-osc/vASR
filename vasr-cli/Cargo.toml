[package]
name = "vasr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vasr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vasr-realtime = { path = "../vasr-realtime" }

[features]
default = []
accelerate = ["vasr-realtime/accelerate"]
cuda = ["vasr-realtime/cuda"]
metal = ["vasr-realtime/metal"]

[lints]
workspace = true
