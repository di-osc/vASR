[package]
name = "vasr-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false, optional = true }
rmp-serde = "1"
rubato = { version = "3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"], optional = true }
thiserror = "2"
unicode-general-category = "1.1.0"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
audio-loading = ["dep:base64", "dep:reqwest", "dep:rubato", "dep:symphonia"]

[lints]
workspace = true
