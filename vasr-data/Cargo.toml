[package]
name = "vasr-data"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
description = "ASR audio, timeline, annotation, and SQLite storage for vASR"

[lib]
name = "vasr_data"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false }
rmp-serde = { version = "1", optional = true }
rubato = "5"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
rustfst = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
unicode-general-category = { version = "1.1.0", optional = true }
unicode-width = "0.2.2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["db", "metrics"]
db = ["dep:rusqlite", "dep:rmp-serde"]
metrics = ["dep:rustfst", "dep:unicode-general-category"]

[[test]]
name = "data_behaviour"
required-features = ["db"]

[[test]]
name = "db_timestamps"
required-features = ["db"]

[[test]]
name = "metrics"
required-features = ["metrics"]

[[test]]
name = "timeline_evaluation"
required-features = ["metrics"]

[[test]]
name = "public_api"
required-features = ["db", "metrics"]

[lints]
workspace = true
