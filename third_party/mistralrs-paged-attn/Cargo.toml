[package]
name = "mistralrs-paged-attn"
authors = ["Eric Buehler"]
version = "0.8.3"
edition = "2021"
rust-version = "1.88"
description = "Fast, flexible LLM inference."
repository = "https://github.com/EricLBuehler/mistral.rs"
keywords = ["llm", "inference", "machine-learning", "ai", "transformers"]
categories = ["science", "api-bindings", "text-processing"]
license = "MIT"
homepage = "https://github.com/EricLBuehler/mistral.rs"

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.10.2", rev = "5404348" }
half = "2.7.1"
float8 = "0.7.0"
objc2-metal = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
dispatch2 = { version = "0.3.0", default-features = false, features = ["block2"], optional = true }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", version = "0.10.2", rev = "5404348", optional = true }
thiserror = "2.0.18"

[build-dependencies]
cudaforge = { version = "0.1.3", optional = true }
anyhow = "1.0.100"

[features]
cuda = ["dep:cudaforge", "candle-core/cuda"]
metal = ["dep:objc2-metal", "dep:objc2-foundation", "dep:dispatch2", "dep:candle-metal-kernels"]
