[workspace]
members = [
  "vasr",
  "vasr-vad",
  "vasr-transcribe",
  "vasr-realtime",
  "vasr-paged-attn",
  "vasr-quant",
  "vasr-flash-attn",
]
resolver = "3"

[workspace.dependencies]
asr-data = { version = "0.2.0", default-features = false, features = ["db", "metrics", "modelscope"] }
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-kernels = "0.11.0"
candle-metal-kernels = "0.11.0"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wangmengdi/Qwen3ASR.rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
