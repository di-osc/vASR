[workspace]
members = [
  "vasr",
  "vasr-vad",
  "vasr-transcribe",
  "vasr-realtime",
  "vasr-paged-attn",
  "vasr-quant",
  "vasr-flash-attn",
]
resolver = "3"

[workspace.dependencies]
# 关闭 `dataset` 特性：该特性唯一作用是引入 modelhub，而 modelhub 被上游精确锁定为
# `=0.1.1`，会导致 cargo 无法将 modelhub 升级到 0.1.3（0.1.x 被视为 semver 兼容区间）。
# 本项目只使用 asr-data 的 `db` 与 `metrics`（`evaluate_dataset` 等仅依赖这两者）。
asr-data = { version = "0.1.2", default-features = false, features = ["db", "metrics"] }

[patch."https://github.com/huggingface/candle.git"]
candle-core = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
candle-nn = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
candle-kernels = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wangmengdi/Qwen3ASR.rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
