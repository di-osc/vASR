[package]
name = "vasr-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vasr-transcribe"
path = "src/bin/vasr_transcribe.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
candle-core = { git = "https://gitee.com/good-as-water/candle", version = "0.10.2", rev = "5404348" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt"] }
vasr-data = { path = "../vasr-data", features = ["audio-loading"] }
vasr = { path = "../vasr" }
vasr-vad = { path = "../vasr-vad" }
uuid = "1"

[features]
default = ["timing"]
accelerate = ["vasr/accelerate"]
cuda = ["cuda-vad", "vasr/cuda", "vasr/cuda-graph", "vasr/flash-attn", "vasr/cuda-quant", "timing", "paged-attn", "cuda-graph"]
cuda-graph = []
cuda-vad = ["vasr-vad/cuda"]
metal = ["vasr/metal-paged-attn", "timing", "paged-attn"]
paged-attn = ["vasr/paged-attn"]
timing = ["vasr/timing"]

[lints]
workspace = true
