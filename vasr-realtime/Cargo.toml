[package]
name = "vasr-realtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vasr-realtime"
path = "src/bin/vasr_realtime.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
candle-core = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
asr-data = { workspace = true }
vasr = { path = "../vasr" }
vasr-vad = { path = "../vasr-vad" }

[features]
default = []
accelerate = ["vasr/accelerate"]
cuda = ["cuda-vad", "vasr/cuda", "vasr/cuda-graph", "vasr/flash-attn", "vasr/cuda-quant", "paged-attn"]
cuda-vad = ["vasr-vad/cuda"]
metal = ["vasr/metal-paged-attn", "paged-attn"]
paged-attn = ["vasr/paged-attn"]
cuda-graph = ["cuda"]

[lints]
workspace = true
