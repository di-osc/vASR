[package]
name = "vasr-realtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vasr-realtime"
path = "src/bin/vasr_realtime.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
candle-core = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
vasr-data = { path = "../vasr-data", features = ["audio-loading"] }
vasr-models = { path = "../vasr-models" }

[features]
default = []
accelerate = ["vasr-models/accelerate"]
cuda = ["cuda-vad", "vasr-models/cuda", "vasr-models/cuda-graph", "vasr-models/flash-attn", "vasr-models/cuda-quant", "paged-attn"]
cuda-vad = ["vasr-models/cuda-vad"]
metal = ["vasr-models/metal-paged-attn", "paged-attn"]
paged-attn = ["vasr-models/paged-attn"]
cuda-graph = ["cuda"]

[lints]
workspace = true
