[package]
name = "vasr-quant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-situ quantization and platform-specific matmul kernels for VASR"

[dependencies]
candle-core = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
candle-kernels = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348", optional = true }
candle-nn = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
candle-metal-kernels = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
half = "2"
anyhow = "1"
tracing = "0.1"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = [
  "candle-core/cuda",
  "dep:candle-kernels",
  "candle-nn/cuda",
  "dep:bindgen_cuda",
]
paged-attn = []
metal-paged-attn = ["metal", "paged-attn", "dep:candle-metal-kernels", "dep:objc2-metal"]
cuda-quant = ["cuda"]
cuda-paged-attn = ["cuda", "paged-attn"]
timing = []

[build-dependencies]
bindgen_cuda = { version = "0.1.5", optional = true }

[lints]
workspace = true
