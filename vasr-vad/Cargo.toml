[package]
name = "vasr-vad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Voice activity detection models and traits for vASR"
categories = ["science"]
keywords = ["vad", "speech", "machine-learning", "funasr"]

[dependencies]
anyhow = "1"
candle-core = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
candle-nn = { git = "https://gitee.com/good-as-water/candle.git", version = "0.10.2", rev = "5404348" }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
kaldi-fbank-rust-kautism = "0.1.0"
ndarray = "0.17"
rayon = "1.7.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"
vasr-data = { path = "../vasr-data" }
modelhub = "0.1.1"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cuda-vad = ["cuda"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
