[package]
name = "vasr-vad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Voice activity detection models and traits for vASR"
categories = ["science"]
keywords = ["vad", "speech", "machine-learning", "funasr"]

[dependencies]
anyhow = "1"
candle-core = { workspace = true }
candle-nn = { workspace = true }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
kaldi-fbank-rust-kautism = "0.1.0"
rayon = "1.7.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"
asr-data = { workspace = true }
modelhub = "0.1.3"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cuda-vad = ["cuda"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
